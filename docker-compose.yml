services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ats_sql_server
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ats_backend
    ports:
      - "5000:8080"
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True;
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=ATS.WebApi
      - Jwt__Audience=ATS.Frontend
      - Jwt__ExpirationMinutes=60
    restart: on-failure

  frontend:
    build:
      context: ./frontend
    container_name: ats_frontend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  sql_data:
